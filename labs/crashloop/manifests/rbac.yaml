apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubix-reader
  namespace: kubix-lab
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubix-reader
  namespace: kubix-lab
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "events"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["replicasets", "deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubix-reader
  namespace: kubix-lab
subjects:
  - kind: ServiceAccount
    name: kubix-reader
    namespace: kubix-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubix-reader
