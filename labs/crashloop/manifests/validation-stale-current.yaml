apiVersion: v1
kind: Pod
metadata:
  name: kubix-validation-stale-current
  namespace: kubix-lab
  labels:
    kubix-validation-pass: stale-current
    app.kubernetes.io/name: kubix-validation-stale-current
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  terminationGracePeriodSeconds: 1
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: app
    image: busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
    imagePullPolicy: IfNotPresent
    command: ["/bin/sh", "-c"]
    args:
    - |
      echo "STALE (cached): previous diagnosis claimed DATABASE_URL was missing"
      echo "FATAL (current): release signature verification failed"
      exit 42
    resources:
      requests:
        cpu: 5m
        memory: 8Mi
      limits:
        cpu: 100m
        memory: 32Mi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
