name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify modules
        run: go mod verify
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Incident lab script guards
        if: runner.os != 'macOS'
        shell: pwsh
        run: ./labs/crashloop/test.ps1
      - name: Race detector
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: Build
        run: go build ./cmd/kubix
